name: Worker Relay Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-relay-production-evidence
  cancel-in-progress: false

jobs:
  production-worker-relay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Install project dependencies
        run: npm ci
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Prove production encrypted Worker relay
        env:
          FILE_QR_PRODUCTION_ORIGIN: https://fileqr.nolane-file.workers.dev/
          FILE_QR_WORKER_RELAY_EVIDENCE_PATH: worker-relay-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f worker-relay-evidence.json
          node tests/browser/production-worker-relay.mjs
          test -s worker-relay-evidence.json
      - name: Validate sanitized PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('worker-relay-evidence.json', 'utf8'));
          const top = Object.keys(x).sort();
          const expected = ['forcedRelay','payloadBytes','productionOrigin','receiver','receivedSha256','result','schemaVersion','sender','sourceSha256','testedAt','transport'].sort();
          if (JSON.stringify(top) !== JSON.stringify(expected)) throw new Error('unexpected evidence keys');
          if (x.schemaVersion !== 1 || x.result !== 'PASS' || x.transport !== 'worker-relay' || x.forcedRelay !== true) throw new Error('invalid relay evidence result');
          if (x.productionOrigin !== 'https://fileqr.nolane-file.workers.dev') throw new Error('wrong production origin');
          if (!Number.isSafeInteger(x.payloadBytes) || x.payloadBytes < 1024) throw new Error('invalid payload size');
          if (!/^[a-f0-9]{64}$/.test(x.sourceSha256) || x.receivedSha256 !== x.sourceSha256) throw new Error('payload SHA-256 mismatch');
          for (const side of ['sender', 'receiver']) {
            const keys = Object.keys(x[side] || {}).sort();
            if (JSON.stringify(keys) !== JSON.stringify(['finalState','relaySocketObserved'])) throw new Error(`unexpected ${side} evidence keys`);
            if (x[side].relaySocketObserved !== true) throw new Error(`${side} relay socket not observed`);
          }
          const serialized = JSON.stringify(x);
          for (const forbidden of ['relaySecret','relayCapability','receiveCode','senderToken','clientIp','fileBytes','payloadBase64']) {
            if (serialized.includes(forbidden)) throw new Error(`forbidden evidence field: ${forbidden}`);
          }
          console.log('Sanitized production Worker relay evidence: PASS');
          NODE
      - name: Publish production Worker relay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-relay-evidence-${{ github.run_id }}
          path: worker-relay-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize evidence
        shell: bash
        run: |
          {
            echo '### File QR production Worker relay evidence'
            echo
            echo 'Canonical production web origin: PASS'
            echo 'Evidence-only forced Worker relay: PASS'
            echo 'Dedicated relay WebSocket observed on both peers: PASS'
            echo 'Independent source/received SHA-256 equality: PASS'
            echo 'Rendezvous secrets, capabilities, codes, IPs and file bytes persisted: NO'
            echo 'Evidence artifact: worker-relay-evidence.json'
          } >> "$GITHUB_STEP_SUMMARY"
