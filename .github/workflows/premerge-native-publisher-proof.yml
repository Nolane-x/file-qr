name: Pre-merge Native Publisher Proof

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-hex candidate commit SHA from Nolane-x/file-qr
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Validate exact candidate SHA syntax
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'candidate_sha must be exactly 40 hexadecimal characters.' >&2
            exit 1
          fi
          echo "sha=$(printf '%s' "$CANDIDATE_SHA" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind candidate to trusted main and audited publisher-proof scope
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(printf '%s' "$CANDIDATE_SHA" | tr '[:upper:]' '[:lower:]')"
          TRUSTED_MAIN_SHA="$(printf '%s' "$TRUSTED_MAIN_SHA" | tr '[:upper:]' '[:lower:]')"

          actual_main="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_main" != "$TRUSTED_MAIN_SHA" ]; then
            echo 'trusted main SHA mismatch after checkout' >&2
            exit 1
          fi

          git fetch --no-tags origin "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          if ! git merge-base --is-ancestor "$TRUSTED_MAIN_SHA" "$CANDIDATE_SHA"; then
            echo 'candidate must contain the current trusted main SHA' >&2
            exit 1
          fi

          mapfile -t changed_paths < <(git diff --name-only "$TRUSTED_MAIN_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort)
          required_paths=(
            '.github/workflows/native.yml'
            'scripts/classify-release-draft.mjs'
            'scripts/configure-android-signing.mjs'
            'scripts/configure-windows-signing.mjs'
            'tests/structure/native-production-signing.test.mjs'
            'tests/structure/release-draft-ownership.test.mjs'
            'tests/structure/release-provenance.test.mjs'
            'tests/unit/native-signing-helpers.test.mjs'
          )
          mapfile -t required_paths < <(printf '%s\n' "${required_paths[@]}" | LC_ALL=C sort)

          scope_error=false
          if [ "${#changed_paths[@]}" -ne "${#required_paths[@]}" ]; then
            scope_error=true
          else
            for index in "${!required_paths[@]}"; do
              if [ "${changed_paths[$index]}" != "${required_paths[$index]}" ]; then
                scope_error=true
                break
              fi
            done
          fi

          if [ "$scope_error" = true ]; then
            echo 'candidate contains changes outside publisher-proof scope or is missing required signing/release changes' >&2
            printf 'Observed candidate paths:\n' >&2
            printf '  %s\n' "${changed_paths[@]}" >&2
            exit 1
          fi

  build_windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          persist-credentials: false
      - name: Bind checkout to exact candidate SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA.ToLowerInvariant()) {
            throw 'candidate SHA mismatch after checkout'
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - name: Build unsigned Windows NSIS candidate
        run: npx tauri build --bundles nsis
        working-directory: apps/native
        env:
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}
      - name: Normalize opaque Windows candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publisher-proof | Out-Null
          $installer = Get-ChildItem apps/native/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows NSIS candidate was not produced.'
          }
          Copy-Item $installer.FullName publisher-proof/FileQR-Windows-x64-unsigned.exe
          Get-FileHash publisher-proof/FileQR-Windows-x64-unsigned.exe -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-proof-windows-candidate
          path: publisher-proof/FileQR-Windows-x64-unsigned.exe
          if-no-files-found: error

  sign_windows:
    needs: [validate, build_windows]
    runs-on: windows-latest
    steps:
      - name: Download opaque Windows candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publisher-proof-windows-candidate
          path: candidate

      - name: Sign and verify Windows publisher identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.comodoca.com' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputPath = 'candidate/FileQR-Windows-x64-unsigned.exe'
          $signedPath = 'signed/FileQR-Windows-x64-signed.exe'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'file-qr-premerge-publisher.pfx'
          $status = 'FAIL'
          $signerThumbprint = $null
          $inputSha256 = $null
          $signedSha256 = $null
          $importedThumbprints = @()
          try {
            if (-not (Test-Path $inputPath)) {
              throw 'Opaque Windows candidate artifact is missing.'
            }
            $inputSha256 = (Get-FileHash $inputPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
              throw 'WINDOWS_CERTIFICATE is required.'
            }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw 'WINDOWS_CERTIFICATE_PASSWORD is required.'
            }
            $base64 = ($env:WINDOWS_CERTIFICATE -replace '\s', '')
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            if ($imported.Count -eq 0) {
              throw 'Publisher certificate import returned no certificates.'
            }
            $importedThumbprints = @($imported | ForEach-Object { $_.Thumbprint } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            "FILE_QR_PREMERGE_WINDOWS_IMPORTED_THUMBPRINTS=$($importedThumbprints -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $cert) {
              throw 'Publisher certificate has no private key.'
            }
            if ($cert.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw 'Publisher certificate is expired.'
            }
            $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            if ($eku -notcontains '1.3.6.1.5.5.7.3.3') {
              throw 'Publisher certificate lacks Code Signing EKU.'
            }
            $signerThumbprint = $cert.Thumbprint.ToLowerInvariant()
            New-Item -ItemType Directory -Force -Path signed | Out-Null
            Copy-Item $inputPath $signedPath
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signtool) {
              throw 'signtool.exe was not found.'
            }
            & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 $signedPath
            if ($LASTEXITCODE -ne 0) {
              throw 'signtool failed.'
            }
            $signature = Get-AuthenticodeSignature $signedPath
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw 'Signed Windows candidate has no signer certificate.'
            }
            if ($signature.SignerCertificate.Thumbprint.ToLowerInvariant() -ne $signerThumbprint) {
              throw 'Signer thumbprint mismatch.'
            }
            $signedSha256 = (Get-FileHash $signedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $status = 'PASS'
          } finally {
            New-Item -ItemType Directory -Force -Path proof | Out-Null
            [ordered]@{
              platform = 'windows'
              candidateSha = $env:CANDIDATE_SHA.ToLowerInvariant()
              status = $status
              inputSha256 = $inputSha256
              signedSha256 = $signedSha256
              signerThumbprint = $signerThumbprint
              observedAt = [DateTime]::UtcNow.ToString('o')
            } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 proof/windows-proof.json
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            foreach ($thumbprint in $importedThumbprints) {
              Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Cleanup Windows publisher material
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'file-qr-premerge-publisher.pfx') -Force -ErrorAction SilentlyContinue
          foreach ($thumbprint in @($env:FILE_QR_PREMERGE_WINDOWS_IMPORTED_THUMBPRINTS -split ',')) {
            $thumbprint = $thumbprint.Trim()
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }
          Remove-Item signed/FileQR-Windows-x64-signed.exe -Force -ErrorAction SilentlyContinue

      - name: Upload sanitized Windows proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-proof-windows-result
          path: proof/windows-proof.json
          if-no-files-found: warn

  build_android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          persist-credentials: false
      - name: Bind checkout to exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$expected" ]; then
            echo 'candidate SHA mismatch after checkout' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - run: npm ci
      - name: Initialize Android project
        run: npm run android:init
        working-directory: apps/native
      - name: Build unsigned Android release candidate
        run: npx tauri android build --apk --target aarch64
        working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}
      - name: Normalize opaque unsigned Android candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publisher-proof
          apk="$(find apps/native/src-tauri/gen/android -type f -name '*release-unsigned.apk' -print -quit)"
          test -n "$apk" || {
            echo 'Unsigned Android release APK was not produced.' >&2
            exit 1
          }
          cp "$apk" publisher-proof/FileQR-Android-arm64-unsigned.apk
          sha256sum publisher-proof/FileQR-Android-arm64-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-proof-android-candidate
          path: publisher-proof/FileQR-Android-arm64-unsigned.apk
          if-no-files-found: error

  sign_android:
    needs: [validate, build_android]
    runs-on: ubuntu-latest
    steps:
      - name: Assert hosted Android signing toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || {
            echo 'ANDROID_HOME is unavailable on the trusted hosted runner.' >&2
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" || {
            echo 'Hosted Android Build-tools 36.0.0 zipalign is unavailable.' >&2
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || {
            echo 'Hosted Android Build-tools 36.0.0 apksigner is unavailable.' >&2
            exit 1
          }
          command -v keytool >/dev/null || {
            echo 'keytool is unavailable on the trusted hosted runner.' >&2
            exit 1
          }
      - name: Download opaque Android candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publisher-proof-android-candidate
          path: candidate

      - name: Sign and verify Android publisher identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          mkdir -p proof
          input='candidate/FileQR-Android-arm64-unsigned.apk'
          aligned="$RUNNER_TEMP/file-qr-premerge-aligned.apk"
          signed="$RUNNER_TEMP/file-qr-premerge-signed.apk"
          keystore="$RUNNER_TEMP/file-qr-premerge-release.jks"
          status='FAIL'
          input_sha256=''
          signed_sha256=''
          certificate_sha256=''
          write_proof() {
            python3 - "$CANDIDATE_SHA" "$status" "$input_sha256" "$signed_sha256" "$certificate_sha256" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          candidate, status, input_digest, signed_digest, cert_digest = sys.argv[1:]
          with open('proof/android-proof.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'platform': 'android',
                  'candidateSha': candidate.lower(),
                  'status': status,
                  'inputSha256': input_digest or None,
                  'signedSha256': signed_digest or None,
                  'certificateSha256': cert_digest or None,
                  'observedAt': datetime.now(timezone.utc).isoformat(),
              }, handle, indent=2)
          PY
          }
          cleanup() {
            rc=$?
            write_proof || true
            rm -f "$keystore" "$aligned" "$signed"
            exit "$rc"
          }
          trap cleanup EXIT
          test -f "$input" || { echo 'Opaque Android candidate artifact is missing.' >&2; exit 1; }
          input_sha256="$(sha256sum "$input" | cut -d' ' -f1)"
          test -n "$ANDROID_KEY_BASE64" || { echo 'ANDROID_KEY_BASE64 is required.' >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required.' >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required.' >&2; exit 1; }
          printf '%s' "$ANDROID_KEY_BASE64" | tr -d '\r\n\t ' | base64 -d > "$keystore"
          chmod 600 "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          certificate_sha256="$(
            keytool -exportcert \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEY_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              | sha256sum \
              | cut -d' ' -f1
          )"
          if ! [[ "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Unable to derive Android release certificate SHA-256 digest.' >&2
            exit 1
          fi
          zipalign -f -p 4 "$input" "$aligned"
          apksigner sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed" \
            "$aligned"
          signer_output="$(apksigner verify --verbose --print-certs "$signed")"
          signer_sha256="$(
            printf '%s\n' "$signer_output" \
              | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ { value=$2; gsub(/:/, "", value); print tolower(value); exit }'
          )"
          test -n "$signer_sha256" || {
            echo 'Android signer SHA-256 digest missing.' >&2
            exit 1
          }
          if [ "$signer_sha256" != "$(printf '%s' "$certificate_sha256" | tr '[:upper:]' '[:lower:]')" ]; then
            echo 'Android signer certificate mismatch.' >&2
            exit 1
          fi
          signed_sha256="$(sha256sum "$signed" | cut -d' ' -f1)"
          status='PASS'

      - name: Cleanup Android publisher material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/file-qr-premerge-release.jks" \
            "$RUNNER_TEMP/file-qr-premerge-aligned.apk" \
            "$RUNNER_TEMP/file-qr-premerge-signed.apk"

      - name: Upload sanitized Android proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-proof-android-result
          path: proof/android-proof.json
          if-no-files-found: warn

  evidence:
    if: always()
    needs: [validate, sign_windows, sign_android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows sanitized proof
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publisher-proof-windows-result
          path: proof/windows

      - name: Download Android sanitized proof
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publisher-proof-android-result
          path: proof/android

      - name: Aggregate exact-candidate publisher evidence
        id: aggregate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          WINDOWS_RESULT: ${{ needs.sign_windows.result }}
          ANDROID_RESULT: ${{ needs.sign_android.result }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          hex40 = re.compile(r'^[0-9a-f]{40}$')
          hex64 = re.compile(r'^[0-9a-f]{64}$')
          candidate = os.environ.get('CANDIDATE_SHA', '').lower()

          def read_json(path):
              try:
                  with open(path, 'r', encoding='utf-8-sig') as handle:
                      value = json.load(handle)
                  return value if isinstance(value, dict) else None
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return None

          def clean_hex(value, pattern):
              if not isinstance(value, str):
                  return None
              value = value.lower()
              return value if pattern.fullmatch(value) else None

          def windows_proof(raw):
              if raw is None:
                  return {
                      'status': 'MISSING',
                      'inputSha256': None,
                      'signedSha256': None,
                      'signerThumbprint': None,
                  }
              status = raw.get('status') if raw.get('status') in {'PASS', 'FAIL'} else 'FAIL'
              input_digest = clean_hex(raw.get('inputSha256'), hex64)
              signed_digest = clean_hex(raw.get('signedSha256'), hex64)
              thumbprint = clean_hex(raw.get('signerThumbprint'), hex40)
              if raw.get('candidateSha', '').lower() != candidate:
                  status = 'FAIL'
              if status == 'PASS' and not all([input_digest, signed_digest, thumbprint]):
                  status = 'FAIL'
              return {
                  'status': status,
                  'inputSha256': input_digest,
                  'signedSha256': signed_digest,
                  'signerThumbprint': thumbprint,
              }

          def android_proof(raw):
              if raw is None:
                  return {
                      'status': 'MISSING',
                      'inputSha256': None,
                      'signedSha256': None,
                      'certificateSha256': None,
                  }
              status = raw.get('status') if raw.get('status') in {'PASS', 'FAIL'} else 'FAIL'
              input_digest = clean_hex(raw.get('inputSha256'), hex64)
              signed_digest = clean_hex(raw.get('signedSha256'), hex64)
              certificate = clean_hex(raw.get('certificateSha256'), hex64)
              if raw.get('candidateSha', '').lower() != candidate:
                  status = 'FAIL'
              if status == 'PASS' and not all([input_digest, signed_digest, certificate]):
                  status = 'FAIL'
              return {
                  'status': status,
                  'inputSha256': input_digest,
                  'signedSha256': signed_digest,
                  'certificateSha256': certificate,
              }

          windows = windows_proof(read_json('proof/windows/windows-proof.json'))
          android = android_proof(read_json('proof/android/android-proof.json'))
          candidate_valid = bool(hex40.fullmatch(candidate))
          overall_pass = (
              candidate_valid
              and os.environ.get('WINDOWS_RESULT') == 'success'
              and os.environ.get('ANDROID_RESULT') == 'success'
              and windows['status'] == 'PASS'
              and android['status'] == 'PASS'
          )

          evidence = {
              'schemaVersion': 1,
              'candidateSha': candidate if candidate_valid else None,
              'workflowRunId': os.environ.get('WORKFLOW_RUN_ID'),
              'workflowRunAttempt': os.environ.get('WORKFLOW_RUN_ATTEMPT'),
              'overallStatus': 'PASS' if overall_pass else 'FAIL',
              'windows': windows,
              'android': android,
              'observedAt': datetime.now(timezone.utc).isoformat(),
          }
          with open('evidence/premerge-native-publisher-proof.json', 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"overall_pass={'true' if overall_pass else 'false'}\n")
          PY

      - name: Upload sanitized pre-merge publisher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: premerge-native-publisher-proof-${{ github.run_id }}
          path: evidence/premerge-native-publisher-proof.json
          if-no-files-found: error

      - name: Require both publisher proofs to pass
        if: always()
        shell: bash
        env:
          OVERALL_PASS: ${{ steps.aggregate.outputs.overall_pass }}
        run: |
          test "$OVERALL_PASS" = 'true' || {
            echo 'Pre-merge publisher proof did not pass for both platforms.' >&2
            exit 1
          }
