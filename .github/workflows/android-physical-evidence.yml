name: Android Physical Evidence

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful protected-main Native Builds run ID to bind this physical ceremony
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  physical-camera:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, file-qr-android-device]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0

      - name: Verify Android lab prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          command -v gh
          command -v unzip
          adb version

      - name: Materialize authoritative Android build input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          node scripts/prepare-android-physical-evidence.mjs \
            --run-id "$NATIVE_RUN_ID" \
            --output-dir physical-input \
            --authority android-build-authority.json

      - name: Collect physical Android camera evidence
        env:
          FILE_QR_APK: physical-input/FileQR-Android-arm64.apk
          FILE_QR_ANDROID_EVIDENCE_PATH: android-physical-evidence.json
        run: node scripts/collect-android-physical-evidence.mjs

      - name: Validate sanitized evidence and build binding
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const evidence = JSON.parse(fs.readFileSync("android-physical-evidence.json", "utf8"));
            const authority = JSON.parse(fs.readFileSync("android-build-authority.json", "utf8"));
            if (evidence?.cameraPermissionGranted !== true) process.exit(1);
            if (evidence?.cameraOwnerObserved !== true) process.exit(1);
            if (evidence?.appRecovered !== true) process.exit(1);
            if (evidence?.cameraImageryCaptured !== false) process.exit(1);
            if (!/^[a-f0-9]{64}$/.test(evidence?.device?.deviceSerialHash || "")) process.exit(1);
            if (!/^[a-f0-9]{64}$/.test(evidence?.device?.buildFingerprintHash || "")) process.exit(1);
            if (!/^[a-f0-9]{40}$/.test(authority?.commitSha || "")) process.exit(1);
            if (!/^[a-f0-9]{64}$/.test(authority?.artifactDigest || "")) process.exit(1);
            if (!/^[a-f0-9]{64}$/.test(authority?.apkSha256 || "")) process.exit(1);
            if (evidence?.apkSha256 !== authority.apkSha256) process.exit(1);
            console.log(`Physical Android camera evidence: PASS (${evidence.device.manufacturer} ${evidence.device.model}, Android ${evidence.device.androidRelease})`);
          '

      - name: Publish physical Android evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-physical-evidence-${{ github.run_id }}
          path: |
            android-build-authority.json
            android-physical-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize physical evidence
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const authority = JSON.parse(fs.readFileSync('android-build-authority.json', 'utf8'));
          console.log('### File QR physical Android evidence');
          console.log();
          console.log(`Trusted Native Builds run: ${authority.workflowRunId}`);
          console.log(`Trusted main commit: \`${authority.commitSha}\``);
          console.log(`Android artifact: ${authority.artifactId} / ${authority.artifactDigest}`);
          console.log(`APK SHA-256: \`${authority.apkSha256}\``);
          console.log('Physical ADB device (emulators rejected): PASS');
          console.log('CAMERA permission on installed File QR: PASS');
          console.log('Native Scan QR control launched physical camera service: PASS');
          console.log('Scanner cancellation returned to File QR UI: PASS');
          console.log('Camera imagery captured by CI: NO');
          console.log('Evidence artifacts: android-build-authority.json + android-physical-evidence.json');
          NODE
