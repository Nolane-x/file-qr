name: Browser Reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interrupted-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local signaling and web runtimes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config services/signaling/wrangler.jsonc --port 8787 --ip 127.0.0.1 > /tmp/file-qr-signaling.log 2>&1 &
          echo $! > /tmp/file-qr-signaling.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/file-qr-signaling.log; exit 1; fi
            sleep 1
          done

          VITE_SIGNALING_ORIGIN=http://127.0.0.1:8787 npm --workspace @file-qr/web run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/file-qr-web.log 2>&1 &
          echo $! > /tmp/file-qr-web.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/file-qr-web.log; exit 1; fi
            sleep 1
          done
      - name: Simulate interruption and OPFS resume
        env:
          FILE_QR_BROWSER_ORIGIN: http://127.0.0.1:5173
          FILE_QR_BROWSER_TEST_BYTES: '33554432'
        run: node --test tests/browser/interrupted-resume.mjs
      - name: Dump service logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- signaling ---'
          cat /tmp/file-qr-signaling.log 2>/dev/null || true
          echo '--- web ---'
          cat /tmp/file-qr-web.log 2>/dev/null || true
