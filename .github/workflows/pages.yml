name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - name: Build web app
        run: npm run build:web
        env:
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy static assets to Cloudflare Workers
        run: npx wrangler deploy --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production website
        shell: bash
        run: |
          endpoint='https://fileqr.nolane-file.workers.dev/'
          for attempt in {1..20}; do
            body=$(curl -fsS "$endpoint" || true)
            if printf '%s' "$body" | grep -q '<title>File QR'; then
              echo "Web production is live at $endpoint"
              exit 0
            fi
            echo "Waiting for Cloudflare propagation ($attempt/20)…"
            sleep 3
          done
          echo 'Production website did not become healthy in time.'
          exit 1
