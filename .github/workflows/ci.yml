name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:web
      - run: npm run build:native-ui
      - run: npm run check:signaling
      - run: npm run check:web-deploy
