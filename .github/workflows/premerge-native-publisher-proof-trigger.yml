name: Pre-merge Native Publisher Proof Trigger

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'publisher-proof' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate live pull request state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'publisher-proof event head SHA is invalid' >&2
            exit 1
          fi

          mapfile -t live_pr < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.head.sha, .head.repo.full_name, .base.ref'
          )
          if [ "${#live_pr[@]}" -ne 3 ]; then
            echo 'unable to resolve live publisher-proof PR state' >&2
            exit 1
          fi

          live_head_sha="$(printf '%s' "${live_pr[0]}" | tr '[:upper:]' '[:lower:]')"
          event_head_sha="$(printf '%s' "$EVENT_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$live_head_sha" != "$event_head_sha" ]; then
            echo 'publisher-proof PR head changed after label; re-label the exact candidate' >&2
            exit 1
          fi
          if [ "${live_pr[1]}" != "$EVENT_HEAD_REPOSITORY" ] || [ "${live_pr[1]}" != "$GITHUB_REPOSITORY" ]; then
            echo 'publisher-proof PR repository changed after label' >&2
            exit 1
          fi
          if [ "${live_pr[2]}" != "$EVENT_BASE_REF" ] || [ "${live_pr[2]}" != 'main' ]; then
            echo 'publisher-proof PR base changed after label' >&2
            exit 1
          fi

          live_main_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' \
              | tr '[:upper:]' '[:lower:]'
          )"
          event_base_sha="$(printf '%s' "$EVENT_BASE_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$live_main_sha" != "$event_base_sha" ]; then
            echo 'trusted main advanced after publisher-proof trigger; rebase or merge main and re-label' >&2
            exit 1
          fi

      - name: Dispatch trusted publisher proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh workflow run premerge-native-publisher-proof.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "candidate_sha=$EVENT_HEAD_SHA"
