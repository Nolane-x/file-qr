name: Native Builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - run: npx tauri build --bundles nsis
        working-directory: apps/native
        env:
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}
      - name: Normalize Windows artifact name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem apps/native/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName release/FileQR-Windows-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-qr-windows
          path: release/FileQR-Windows-x64-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - run: npm ci
      - name: Initialize Android project with camera permission
        run: npm run android:init
        working-directory: apps/native
      - name: Verify Android camera manifest
        run: |
          grep -R -q 'android.permission.CAMERA' apps/native/src-tauri/gen/android
          grep -R -q 'android.hardware.camera.any' apps/native/src-tauri/gen/android
      - name: Build installable preview APK
        run: npx tauri android build --apk --debug --target aarch64
        working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}
      - name: Normalize Android artifact name
        run: |
          mkdir -p release
          apk=$(find apps/native/src-tauri/gen/android -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" release/FileQR-Android-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-qr-android
          path: release/FileQR-Android-arm64.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [windows, android]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Check whether package-version release already exists
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; leaving it unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create deterministic SHA-256 release manifest
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f FileQR-Windows-x64-setup.exe
          test -f FileQR-Android-arm64.apk
          sha256sum \
            FileQR-Windows-x64-setup.exe \
            FileQR-Android-arm64.apk \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest release artifacts and checksum manifest
        if: steps.release_state.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/FileQR-Windows-x64-setup.exe
            release-assets/FileQR-Android-arm64.apk
            release-assets/SHA256SUMS.txt

      - name: Publish package-version release once
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            release-assets/FileQR-Windows-x64-setup.exe \
            release-assets/FileQR-Android-arm64.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "File QR $TAG" \
            --generate-notes

      - name: Verify published release bytes and attestations
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf published-release
          mkdir -p published-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-release
          cd published-release
          test -f FileQR-Windows-x64-setup.exe
          test -f FileQR-Android-arm64.apk
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh attestation verify FileQR-Windows-x64-setup.exe --repo "$GITHUB_REPOSITORY"
          gh attestation verify FileQR-Android-arm64.apk --repo "$GITHUB_REPOSITORY"
          gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
