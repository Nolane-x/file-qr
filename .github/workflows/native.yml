name: Native Builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci

      - name: Assert production Windows signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw 'WINDOWS_CERTIFICATE is required for production native releases.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required for production native releases.'
          }

      - name: Import production Windows signing certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'file-qr-code-signing.pfx'
          try {
            $base64 = ($env:WINDOWS_CERTIFICATE -replace '\s', '')
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            if ($imported.Count -eq 0) {
              throw 'Windows signing certificate import returned no certificates.'
            }
            $importedThumbprints = @($imported | ForEach-Object { $_.Thumbprint } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            "FILE_QR_WINDOWS_IMPORTED_THUMBPRINTS=$($importedThumbprints -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $cert) {
              throw 'Imported Windows signing certificate has no private key.'
            }
            "FILE_QR_WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($cert.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw 'Windows signing certificate is expired.'
            }
            $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            if ($eku -notcontains '1.3.6.1.5.5.7.3.3') {
              throw 'Windows certificate is not valid for Code Signing EKU.'
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Configure Tauri Windows signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FILE_QR_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.comodoca.com' }}
        run: node scripts/configure-windows-signing.mjs

      - name: Build Windows NSIS package
        run: npx tauri build --bundles nsis
        working-directory: apps/native
        env:
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}

      - name: Normalize Windows artifact name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem apps/native/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows NSIS installer was not produced.' }
          Copy-Item $installer.FullName release/FileQR-Windows-x64-setup.exe

      - name: Verify Windows Authenticode signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'release/FileQR-Windows-x64-setup.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows Authenticode verification failed: $($signature.Status)"
          }
          if ($null -eq $signature.SignerCertificate) {
            throw 'Windows installer has no signer certificate.'
          }
          if ($signature.SignerCertificate.Thumbprint -ne $env:FILE_QR_WINDOWS_CERT_THUMBPRINT) {
            throw 'Windows installer was signed by an unexpected certificate.'
          }

      - name: Cleanup Windows signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'file-qr-code-signing.pfx') -Force -ErrorAction SilentlyContinue
          foreach ($thumbprint in @($env:FILE_QR_WINDOWS_IMPORTED_THUMBPRINTS -split ',')) {
            $thumbprint = $thumbprint.Trim()
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-qr-windows
          path: release/FileQR-Windows-x64-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - run: npm ci

      - name: Assert production Android signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEY_BASE64" || { echo 'ANDROID_KEY_BASE64 is required for production native releases.' >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required for production native releases.' >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required for production native releases.' >&2; exit 1; }

      - name: Initialize Android project with camera permission
        run: npm run android:init
        working-directory: apps/native

      - name: Verify Android camera manifest
        run: |
          grep -R -q 'android.permission.CAMERA' apps/native/src-tauri/gen/android
          grep -R -q 'android.hardware.camera.any' apps/native/src-tauri/gen/android

      - name: Exercise Android release signing patch with ephemeral CI key
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_KEYSTORE="$RUNNER_TEMP/file-qr-ci-source.jks"
          PATCHED_KEYSTORE="$RUNNER_TEMP/file-qr-ci-patched.jks"
          CI_PASSWORD='file-qr-ci-signing'
          CI_ALIAS='file-qr-ci'
          keytool -genkeypair \
            -keystore "$SOURCE_KEYSTORE" \
            -storepass "$CI_PASSWORD" \
            -keypass "$CI_PASSWORD" \
            -alias "$CI_ALIAS" \
            -dname "CN=File QR CI Preview, O=File QR, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype JKS \
            -noprompt >/dev/null 2>&1
          export ANDROID_KEY_BASE64="$(base64 -w0 "$SOURCE_KEYSTORE")"
          export ANDROID_KEY_PASSWORD="$CI_PASSWORD"
          export ANDROID_KEY_ALIAS="$CI_ALIAS"
          export FILE_QR_ANDROID_KEYSTORE_PATH="$PATCHED_KEYSTORE"
          node scripts/configure-android-signing.mjs
          keytool -list \
            -keystore "$PATCHED_KEYSTORE" \
            -storepass "$CI_PASSWORD" \
            -alias "$CI_ALIAS" >/dev/null
          rm -f "$SOURCE_KEYSTORE"

      - name: Configure Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FILE_QR_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/file-qr-release.jks
        run: node scripts/configure-android-signing.mjs

      - name: Validate Android release keystore and certificate identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/file-qr-release.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cert_sha256="$(
            keytool -exportcert \
              -keystore "$RUNNER_TEMP/file-qr-release.jks" \
              -storepass "$ANDROID_KEY_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              | sha256sum \
              | cut -d' ' -f1
          )"
          if ! [[ "$cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Unable to derive Android release certificate SHA-256 digest.' >&2
            exit 1
          fi
          echo "FILE_QR_ANDROID_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Build signed production APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx tauri android build --apk --target aarch64
        working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}

      - name: Build installable preview APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npx tauri android build --apk --debug --target aarch64
        working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          VITE_SIGNALING_ORIGIN: ${{ vars.SIGNALING_ORIGIN || 'https://file-qr-signaling.nolane-file.workers.dev' }}

      - name: Normalize Android artifact name
        run: |
          mkdir -p release
          apk=$(find apps/native/src-tauri/gen/android -type f -name '*.apk' ! -name '*unsigned*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          test -n "$apk"
          cp "$apk" release/FileQR-Android-arm64.apk

      - name: Verify Android APK signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          signer_output="$(apksigner verify --verbose --print-certs release/FileQR-Android-arm64.apk)"
          printf '%s\n' "$signer_output"
          signer_sha256="$(
            printf '%s\n' "$signer_output" \
              | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ { value=$2; gsub(/:/, "", value); print tolower(value); exit }'
          )"
          expected_sha256="$(printf '%s' "$FILE_QR_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$signer_sha256" ] || [ "$signer_sha256" != "$expected_sha256" ]; then
            echo 'Android APK signer certificate does not match the configured release keystore.' >&2
            exit 1
          fi

      - name: Cleanup ephemeral Android signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/file-qr-ci-source.jks" \
            "$RUNNER_TEMP/file-qr-ci-patched.jks" \
            "$RUNNER_TEMP/file-qr-release.jks" \
            apps/native/src-tauri/gen/android/keystore.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-qr-android
          path: release/FileQR-Android-arm64.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [windows, android]
    concurrency:
      group: file-qr-native-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Check whether package-version release already exists
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_STATE_JSON="$RUNNER_TEMP/file-qr-release-state.json"
            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json author,body,isDraft,tagName,targetCommitish \
              > "$RELEASE_STATE_JSON"
            decision="$(
              node scripts/classify-release-draft.mjs \
                "$RELEASE_STATE_JSON" \
                "$TAG" \
                "$GITHUB_REPOSITORY" \
                ".github/workflows/native.yml"
            )"
            case "$decision" in
              recoverable-owned-draft)
                echo "Removing owned stale draft release $TAG before rebuilding it."
                gh release delete "$TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --cleanup-tag \
                  --yes
                echo "exists=false" >> "$GITHUB_OUTPUT"
                ;;
              published-existing-release)
                echo "exists=true" >> "$GITHUB_OUTPUT"
                echo "Release $TAG already exists; leaving it unchanged."
                ;;
              foreign-or-ambiguous-draft)
                echo "Refusing to delete foreign or ambiguous draft release $TAG." >&2
                exit 1
                ;;
              *)
                echo "Unknown release ownership decision: $decision" >&2
                exit 1
                ;;
            esac
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create deterministic SHA-256 release manifest
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f FileQR-Windows-x64-setup.exe
          test -f FileQR-Android-arm64.apk
          sha256sum \
            FileQR-Windows-x64-setup.exe \
            FileQR-Android-arm64.apk \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest release artifacts and checksum manifest
        if: steps.release_state.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/FileQR-Windows-x64-setup.exe
            release-assets/FileQR-Android-arm64.apk
            release-assets/SHA256SUMS.txt

      - name: Create draft package-version release
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          OWNERSHIP_MARKER="<!-- file-qr-native-release:v1 repo=$GITHUB_REPOSITORY workflow=.github/workflows/native.yml target=$GITHUB_SHA -->"
          gh release create "$TAG" \
            release-assets/FileQR-Windows-x64-setup.exe \
            release-assets/FileQR-Android-arm64.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "File QR $TAG" \
            --notes "$OWNERSHIP_MARKER" \
            --generate-notes \
            --draft

      - name: Verify draft release bytes and attestations
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true'
          rm -rf published-release
          mkdir -p published-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-release
          cd published-release
          test -f FileQR-Windows-x64-setup.exe
          test -f FileQR-Android-arm64.apk
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh attestation verify FileQR-Windows-x64-setup.exe --repo "$GITHUB_REPOSITORY"
          gh attestation verify FileQR-Android-arm64.apk --repo "$GITHUB_REPOSITORY"
          gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"

      - name: Publish verified package-version release
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false \
            --repo "$GITHUB_REPOSITORY"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'false'
